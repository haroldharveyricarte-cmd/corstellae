<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorStellae - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">CorStellae <span class="badge">Admin</span></div>
    <button class="hamburger-btn" id="open-sidebar-btn" aria-label="Open Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Side Drawer -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">CorStellae</div>
      <span class="close-sidebar" id="close-sidebar-btn">&times;</span>
    </div>
    <div id="sidebar-user-box" class="sidebar-user-box"></div>
    <ul class="sidebar-menu">
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="submit.html">✍️ Share Your Story</a></li>
      <li><a href="admin.html" class="active admin-link">🛡️ Admin Panel</a></li>
    </ul>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <main class="container admin-container">
    <header class="admin-header">
      <h2>Admin Control Center</h2>
      <p>Manage posts, approve comments, and oversee user accounts.</p>
    </header>

    <!-- Admin Navigation Tabs -->
    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchAdminTab('pending-posts-section')">
        📝 Pending Posts (<span id="count-pending-posts">0</span>)
      </button>
      <button class="tab-btn" onclick="switchAdminTab('pending-comments-section')">
        💬 Pending Comments (<span id="count-pending-comments">0</span>)
      </button>
      <button class="tab-btn" onclick="switchAdminTab('live-posts-section')">
        🌐 Live Posts & Edit
      </button>
      <button class="tab-btn" onclick="switchAdminTab('users-section')">
        👥 Users List
      </button>
    </div>

    <!-- Tab 1: Pending Posts -->
    <section id="pending-posts-section" class="admin-tab-content active">
      <h3>Pending Posts Moderation</h3>
      <div id="pending-posts-list" class="posts-list"></div>
    </section>

    <!-- Tab 2: Pending Comments -->
    <section id="pending-comments-section" class="admin-tab-content" style="display: none;">
      <h3>Pending Comments Moderation</h3>
      <div id="pending-comments-list" class="comments-admin-list"></div>
    </section>

    <!-- Tab 3: Live Posts Management (Edit & Delete) -->
    <section id="live-posts-section" class="admin-tab-content" style="display: none;">
      <h3>Manage Published Posts</h3>
      <div id="live-posts-list" class="posts-list"></div>
    </section>

    <!-- Tab 4: Users List -->
    <section id="users-section" class="admin-tab-content" style="display: none;">
      <h3>Registered Users</h3>
      <div id="users-list" class="users-table-container"></div>
    </section>
  </main>

  <!-- Edit Post Modal -->
  <div id="edit-post-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-modal" onclick="closeEditModal()">&times;</span>
      <h3>Edit Published Post</h3>
      <form id="edit-post-form">
        <input type="hidden" id="edit-post-id">
        <div class="form-group">
          <label for="edit-post-title">Title</label>
          <input type="text" id="edit-post-title" required>
        </div>
        <div class="form-group">
          <label for="edit-post-content">Story Content</label>
          <textarea id="edit-post-content" rows="6" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
