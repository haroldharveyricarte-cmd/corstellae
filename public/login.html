<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorStellae - Login & Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">CorStellae</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="submit.html">Share Your Story</a>
    </div>
  </nav>

  <main class="container">
    <div class="form-card auth-card">
      
      <!-- Tab Controls -->
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
        <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username or Email</label>
          <input type="text" id="login-username" placeholder="Enter username or email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <!-- Registration Form (Hidden by default) -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label for="reg-nickname">Nickname / Display Name</label>
          <input type="text" id="reg-nickname" placeholder="e.g. Starlight, Alex, Scholar99" required>
          <small class="help-text">This is the name shown when you choose to publish publicly.</small>
        </div>

        <div class="form-group">
          <label for="reg-email">School Email</label>
          <input type="email" id="reg-email" placeholder="student@school.edu" required>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Create a password" required>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <div id="auth-message" class="message-box" style="display: none;"></div>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
